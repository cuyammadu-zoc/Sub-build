name: MarkItDown Automated Docs Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-converter.yml'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  convert-documents:
    name: Convert Specs & PDFs to Markdown
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[all]"

      - name: Run MarkItDown Conversion Tool
        run: |
          python tools/convert_docs.py
